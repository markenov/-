document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s-serif}\ninput:focus,textarea:focus{outline:2px solid #1E9BD7;outline-offset:1px}\n@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ============ NAV ============ -->\n<header data-screen-label=\"Навигация\" style=\"position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(11,36,71,0.10)\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;gap:24px\">\n    <a href=\"Программы развития КМГ Инжиниринг.dc.html\" style=\"display:flex;align-items:center;gap:10px;color:#3D5473;font-size:14px;font-weight:700\" style-hover=\"color:#F26B21\">← Программы развития<\u002Fa>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:14px\">\n      <img src=\"b2ec71d0-6462-4629-a012-1985e572a752\" alt=\"КМГ Инжиниринг\" style=\"height:40px;width:auto;display:block\">\n      <img src=\"2cbd91cd-24ac-4c6f-857e-c8e281529e9b\" alt=\"Women's Space\" style=\"height:26px;width:auto;object-fit:contain;display:block\">\n    <\u002Fdiv>\n    <a href=\"#join\" style=\"background:#F26B21;color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px\" style-hover=\"background:#0B5FB0;color:#fff\">Подать заявку<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ HERO ============ -->\n<section id=\"hero\" data-screen-label=\"Hero\" style=\"background:linear-gradient(165deg,#0B2447 0%,#0B5FB0 135%);color:#fff;overflow:hidden\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:80px 24px 72px;display:grid;grid-template-columns:1.3fr auto;gap:40px;align-items:center\">\n    <div>\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:28px;animation:fadeUp .5s ease both\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;border:1.5px solid rgba(255,255,255,0.35);padding:7px 14px;border-radius:999px\">Women's Space<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;color:#C4D6EE\">Корпоративная программа ТОО «КМГ Инжиниринг»<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(34px,5.2vw,72px);line-height:1.04;margin:0;letter-spacing:-0.01em;text-transform:uppercase;max-width:1000px;animation:fadeUp .6s ease both\">\n      Развиваем женщин в&nbsp;инженерии, технологиях и&nbsp;<span style=\"color:#F79A5C\">лидерстве<\u002Fspan>\n    <\u002Fh1>\n    <p style=\"max-width:600px;font-size:18px;line-height:1.6;font-weight:500;color:#C4D6EE;margin:26px 0 0;animation:fadeUp .7s ease both\">Программа создана для раскрытия потенциала женщин в инженерной, технической и управленческой среде.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;animation:fadeUp .8s ease both\">\n      <sc-for list=\"{{ heroChips }}\" as=\"ch\" hint-placeholder-count=\"3\">\n        <span style=\"background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:700\">{{ ch }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:56px 0 0;font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(15px,1.6vw,20px);line-height:1.5;color:#fff;max-width:760px;animation:fadeUp .9s ease both\">«Мы создаём пространство, где опыт превращается в рост, а&nbsp;идеи&nbsp;— в&nbsp;реальные изменения»<\u002Fp>\n    <\u002Fdiv>\n    <img src=\"5cd035c5-b0af-41b8-b2b8-428a3df13a9e\" alt=\"Women's Space\" style=\"width:min(420px,100%);height:auto;object-fit:contain;justify-self:center;animation:fadeUp .6s ease both\">\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ ABOUT ============ -->\n<section id=\"about\" data-screen-label=\"О клубе\" style=\"background:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px 72px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:start\">\n      <div>\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#F26B21;margin-bottom:14px\">О клубе<\u002Fdiv>\n        <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(26px,3vw,44px);line-height:1.08;margin:0;text-transform:uppercase\">Что такое Women's Space<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 22px;font-size:17px;line-height:1.65;color:#3D5473\">Корпоративная программа ТОО «КМГ Инжиниринг», направленная на развитие кадрового потенциала женщин и расширение их участия в инженерной, технической и управленческой деятельности.<\u002Fp>\n        <p style=\"margin:0 0 18px;font-size:15px;font-weight:800;color:#0B2447\">Программа объединяет работниц компании и создаёт условия для:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ conditions }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:14px;background:#F4F7FB;border-radius:14px;padding:16px 20px\">\n              <span style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:15px;color:#0B5FB0;flex:none\">{{ c.n }}<\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600;line-height:1.45\">{{ c.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ STATS ============ -->\n<section id=\"stats\" data-screen-label=\"Наша статистика\" style=\"background:#0B2447;color:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:72px 24px\">\n    <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(26px,3vw,42px);line-height:1.05;margin:0 0 40px;text-transform:uppercase\">Наша статистика<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(34px,4vw,52px);color:#F26B21;line-height:1\">{{ s.n }}<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;line-height:1.4;color:#C4D6EE\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ GOAL ============ -->\n<section id=\"goal\" data-screen-label=\"Цель\" style=\"background:#F26B21;color:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:72px 24px\">\n    <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#0B2447;margin-bottom:16px\">Цель программы<\u002Fdiv>\n    <p style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(20px,2.6vw,34px);line-height:1.3;max-width:1020px\">Развитие кадрового потенциала женщин и повышение их представленности в инженерных, технических (STEM) и управленческих направлениях деятельности Товарищества<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TASKS ============ -->\n<section id=\"tasks\" data-screen-label=\"Задачи\" style=\"background:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px\">\n    <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,48px);line-height:1.05;margin:0 0 40px;text-transform:uppercase\">Задачи программы<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n      <sc-for list=\"{{ tasks }}\" as=\"tk\" hint-placeholder-count=\"4\">\n        <div style=\"background:{{ tk.bg }};color:{{ tk.fg }};border-radius:18px;padding:30px 28px;display:flex;flex-direction:column;gap:12px;min-height:190px\">\n          <div style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:30px;color:{{ tk.numColor }}\">{{ tk.num }}<\u002Fdiv>\n          <div style=\"font-size:18px;font-weight:800;line-height:1.3\">{{ tk.title }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:{{ tk.muted }}\">{{ tk.text }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;background:#F4F7FB;border-radius:16px;padding:22px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <span style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:20px;color:#F26B21\">✳<\u002Fspan>\n      <p style=\"margin:0;font-size:15.5px;font-weight:700;line-height:1.5\">Программа открыта для всех женщин ТОО «КМГ Инжиниринг» — независимо от должности, стажа и подразделения<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;background:#F4F7FB;border-radius:16px;padding:22px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n      <span style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:20px;color:#F26B21\">✳<\u002Fspan>\n      <p style=\"margin:0;font-size:15.5px;font-weight:700;line-height:1.5\">КМГ Инжиниринг стал первой нефтегазовой компанией Казахстана, которая приняла Women's Empowerment Principles (Принципы расширения прав и возможностей женщин)<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DIRECTIONS ============ -->\n<section id=\"directions\" data-screen-label=\"Направления\" style=\"background:#0B2447;color:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:14px\">\n      <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,48px);line-height:1.05;margin:0;text-transform:uppercase\">Основные направления<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width:640px;font-size:16px;line-height:1.6;color:#9FB4D0;margin:0 0 44px\">Программа Women's Space реализуется по четырём ключевым направлениям.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n      <sc-for list=\"{{ directions }}\" as=\"d\" hint-placeholder-count=\"4\">\n        <div style=\"background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"width:46px;height:46px;border-radius:50%;background:#F26B21;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:17px;flex:none\">{{ d.num }}<\u002Fdiv>\n          <div style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(17px,1.8vw,22px);line-height:1.25\">{{ d.title }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#9FB4D0\">{{ d.text }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ WE HELP ============ -->\n<section id=\"help\" data-screen-label=\"Мы помогаем\" style=\"background:#F4F7FB\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px\">\n    <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,48px);line-height:1.05;margin:0 0 40px;text-transform:uppercase\">Мы помогаем<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n      <sc-for list=\"{{ helps }}\" as=\"h\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid rgba(11,36,71,0.08);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"width:44px;height:5px;border-radius:999px;background:#F26B21\"><\u002Fdiv>\n          <p style=\"margin:0;font-size:17px;font-weight:800;line-height:1.45\">{{ h }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SHE TALKS ============ -->\n<section id=\"shetalks\" data-screen-label=\"She Talks\" style=\"background:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px\">\n    <div style=\"background:linear-gradient(150deg,#0B5FB0 0%,#0B2447 110%);color:#fff;border-radius:24px;padding:52px;display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center\">\n      <div>\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#F79A5C;margin-bottom:14px\">Медиа-проект<\u002Fdiv>\n        <img src=\"64bb06a3-d4ad-462f-ac46-c84976cf732d\" alt=\"She Talks by Women's Space\" style=\"height:76px;width:auto;object-fit:contain;object-position:left center;margin:0 0 18px;display:block\">\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.6;color:#C4D6EE;max-width:460px\">Внутренний медиа-проект программы Women's Space, направленный на популяризацию роли женщин в инженерии, науке и управлении.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:26px\">\n          <sc-for list=\"{{ sheTalks }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:12px;color:#F79A5C;flex:none\">{{ s.n }}<\u002Fspan>\n              <span style=\"font-size:14.5px;font-weight:700;line-height:1.4\">{{ s.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <a href=\"Программы развития КМГ Инжиниринг.dc.html#podcasts\" style=\"display:inline-block;background:#F26B21;color:#fff;font-weight:700;font-size:15px;padding:13px 26px;border-radius:999px\" style-hover=\"background:#fff;color:#0B2447\">Все подкасты компании<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"position:relative;border-radius:16px;overflow:hidden;background:#071A38;box-shadow:0 16px 44px rgba(3,14,32,0.45)\">\n          <div style=\"display:flex;transition:transform .5s cubic-bezier(.22,.8,.24,1);transform:translateX(-{{ stPct }}%)\">\n            <sc-for list=\"{{ stVideos }}\" as=\"v\" hint-placeholder-count=\"1\">\n              <div style=\"flex:0 0 100%;min-width:0\">\n                <sc-if value=\"{{ v.playing }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"position:relative;aspect-ratio:16/9;background:#000\">\n                    <iframe src=\"{{ v.embed }}\" title=\"{{ v.title }}\" allow=\"autoplay; encrypted-media; picture-in-picture\" allowfullscreen=\"{{ true }}\" style=\"position:absolute;inset:0;width:100%;height:100%;border:none\"><\u002Fiframe>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ v.notPlaying }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div onclick=\"{{ v.play }}\" style=\"position:relative;aspect-ratio:16/9;cursor:pointer;background:#071A38\">\n                    <img src=\"{{ v.thumb }}\" alt=\"{{ v.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.9\">\n                    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\">\n                      <div style=\"width:56px;height:56px;border-radius:50%;background:#F26B21;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.4)\">\n                        <div style=\"width:0;height:0;border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"padding:16px 20px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n                  <div style=\"min-width:0\">\n                    <div style=\"font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#5FA8E0;margin-bottom:4px\">{{ v.tag }}<\u002Fdiv>\n                    <div style=\"font-size:15px;font-weight:700;line-height:1.35;color:#fff\">{{ v.title }}<\u002Fdiv>\n                    <div style=\"font-size:13px;font-weight:500;line-height:1.4;color:#9FB4D0;margin-top:3px\">{{ v.topic }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <a href=\"{{ v.url }}\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;font-size:13px;font-weight:800;color:#F79A5C\" style-hover=\"color:#fff\">YouTube ↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button onclick=\"{{ stPrev }}\" aria-label=\"prev\" style=\"position:absolute;left:12px;top:34%;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;background:rgba(7,26,56,0.65);color:#fff;font-size:17px;font-weight:800\" style-hover=\"background:#F26B21;color:#fff\">‹<\u002Fbutton>\n          <button onclick=\"{{ stNext }}\" aria-label=\"next\" style=\"position:absolute;right:12px;top:34%;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;background:rgba(7,26,56,0.65);color:#fff;font-size:17px;font-weight:800\" style-hover=\"background:#F26B21;color:#fff\">›<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;justify-content:center;margin-top:14px\">\n          <sc-for list=\"{{ stDots }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ d.go }}\" aria-label=\"slide\" style=\"width:{{ d.w }}px;height:7px;border-radius:999px;border:none;cursor:pointer;background:{{ d.bg }};transition:all .3s\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ JOIN FORM ============ -->\n<section id=\"join\" data-screen-label=\"Форма заявки\" style=\"background:#0B5FB0;color:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px;display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center\">\n    <div>\n      <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.2vw,46px);line-height:1.08;margin:0 0 18px;text-transform:uppercase\">Вступить в Women's Space<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#CFE3F7;margin:0 0 32px;max-width:480px\">Заполните форму — ваша заявка попадёт координатору программы Асем Аяшевой, она свяжется с вами и пригласит на ближайшую встречу сообщества.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:440px\">\n        <sc-for list=\"{{ nextSteps }}\" as=\"ns\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:flex-start;gap:14px\">\n            <span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:800;font-size:12px\">{{ ns.n }}<\u002Fspan>\n            <span style=\"font-size:14.5px;line-height:1.5;color:#E8F0FA;padding-top:4px\">{{ ns.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;color:#0B2447;border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(4,20,44,0.35)\">\n      <sc-if value=\"{{ formNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <form onsubmit=\"{{ submitForm }}\" style=\"display:flex;flex-direction:column;gap:16px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Имя и фамилия\n            <input required=\"{{ true }}\" value=\"{{ formName }}\" onchange=\"{{ onNameChange }}\" placeholder=\"Айгерим Сапарова\" style=\"border:1.5px solid rgba(11,36,71,0.18);border-radius:10px;padding:12px 14px;font-size:15px\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Департамент / подразделение\n            <input required=\"{{ true }}\" value=\"{{ formDept }}\" onchange=\"{{ onDeptChange }}\" placeholder=\"Департамент разработки месторождений\" style=\"border:1.5px solid rgba(11,36,71,0.18);border-radius:10px;padding:12px 14px;font-size:15px\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Что вы ждёте от программы (необязательно)\n            <textarea value=\"{{ formNote }}\" onchange=\"{{ onNoteChange }}\" rows=\"{{ 3 }}\" placeholder=\"Менторство, развитие лидерских навыков, нетворкинг…\" style=\"border:1.5px solid rgba(11,36,71,0.18);border-radius:10px;padding:12px 14px;font-size:15px;resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n          <label style=\"display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;color:#3D5473;cursor:pointer\">\n            <input type=\"checkbox\" checked=\"{{ agreeManager }}\" onchange=\"{{ onAgreeChange }}\" style=\"margin-top:2px\">\n            Я уведомлю своего руководителя об участии в программе (согласование не требуется, но рекомендуется)\n          <\u002Flabel>\n          <button type=\"submit\" style=\"margin-top:6px;background:#F26B21;color:#fff;border:none;cursor:pointer;font-weight:800;font-size:16px;padding:15px;border-radius:999px\" style-hover=\"background:#0B2447\">Отправить заявку<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ formSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:28px 6px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n          <div style=\"width:60px;height:60px;border-radius:50%;background:#E8F5EC;color:#1F8A5B;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800\">✓<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800\">Заявка отправлена!<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#3D5473\">Добро пожаловать в сообщество. Куратор Women's Space свяжется с вами в ближайшее время.<\u002Fp>\n          <button onclick=\"{{ resetForm }}\" style=\"background:none;border:none;cursor:pointer;font-size:14px;font-weight:700;color:#0B5FB0\" style-hover=\"color:#F26B21\">Отправить ещё одну заявку<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DOCS ============ -->\n<section id=\"docs\" data-screen-label=\"Внутренняя нормативная документация\" style=\"background:#fff\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:88px 24px\">\n    <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,48px);line-height:1.05;margin:0 0 16px;text-transform:uppercase\">Внутренняя нормативная документация<\u002Fh2>\n    <p style=\"max-width:640px;font-size:16px;line-height:1.6;color:#3D5473;margin:0 0 40px\">Утверждённые документы программы Women's Space — ознакомьтесь перед подачей заявки.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px\">\n      <sc-for list=\"{{ docs }}\" as=\"doc\" hint-placeholder-count=\"4\">\n        <a href=\"{{ doc.href }}\" style=\"display:flex;align-items:center;gap:16px;background:#F4F7FB;border:1px solid rgba(11,36,71,0.08);border-radius:16px;padding:20px 22px;color:#0B2447\" style-hover=\"box-shadow:0 10px 28px rgba(7,29,61,0.12)\">\n          <div style=\"flex:none;width:46px;height:46px;border-radius:12px;background:#0B2447;color:#fff;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:11px;letter-spacing:0.02em\">PDF<\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:15px;font-weight:800;line-height:1.35\">{{ doc.title }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:600;color:#3D5473;margin-top:2px\">{{ doc.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CONTACTS ============ -->\n<section id=\"contacts\" data-screen-label=\"Контакты\" style=\"background:#F4F7FB\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:80px 24px\">\n    <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(28px,3.4vw,48px);line-height:1.05;margin:0 0 36px;text-transform:uppercase\">Контакты<\u002Fh2>\n    <div style=\"background:#fff;border:1px solid rgba(11,36,71,0.08);border-radius:20px;padding:36px 40px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;max-width:640px\">\n      <div style=\"min-width:0\">\n        <div style=\"font-size:19px;font-weight:800;margin-bottom:4px\">Асем Аяшева<\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:600;color:#3D5473;margin-bottom:12px\">Координатор программы Women's Space<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px;font-size:15px\">\n          <a href=\"mailto:a.nurakhmetova@kmge.kz\" style=\"color:#0B5FB0;font-weight:700\" style-hover=\"color:#F26B21\">a.nurakhmetova@kmge.kz<\u002Fa>\n          <span style=\"color:#3D5473;font-weight:600\">609-316<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <img src=\"5c91b810-cbdc-4dd6-a0b6-0a6a39217513\" alt=\"Асем Аяшева\" style=\"width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer data-screen-label=\"Футер\" style=\"background:#071A38;color:#9FB4D0\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:48px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <img src=\"b2ec71d0-6462-4629-a012-1985e572a752\" alt=\"КМГ Инжиниринг\" style=\"height:48px;width:auto;display:block;background:#fff;border-radius:12px;padding:6px\">\n      <div style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:14px;color:#fff\">Women's Space<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;max-width:520px\">\n      <p style=\"margin:0 0 8px;font-size:13.5px;line-height:1.6\">КМГ Инжиниринг поддерживает Принципы расширения прав и возможностей женщин ООН (UN WEPs).<\u002Fp>\n      <a href=\"Программы развития КМГ Инжиниринг.dc.html\" style=\"font-size:13px;font-weight:700;color:#5FA8E0\" style-hover=\"color:#F26B21\">← Все программы развития<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { formName: '', formDept: '', formNote: '', submitted: false, stSlide: 0, stPlaying: null, agreeManager: false };\n\n  componentDidMount() {\n    this.startStAuto();\n  }\n  componentWillUnmount() {\n    clearInterval(this._stTimer);\n  }\n  startStAuto() {\n    clearInterval(this._stTimer);\n    this._stTimer = setInterval(() => {\n      if (this.state.stPlaying) return;\n      this.setState(s => ({ stSlide: (s.stSlide + 1) % 4 }));\n    }, 7000);\n  }\n  goSt(i) {\n    const n = 4;\n    this.setState({ stSlide: (i + n) % n, stPlaying: null });\n    this.startStAuto();\n  }\n\n  renderVals() {\n    const heroChips = ['Сообщество единомышленниц', 'Профессиональный рост и развитие', 'Лидерство и влияние в компании'];\n\n    const conditions = [\n      'Развития лидерских компетенций',\n      'Обмена опытом и практиками',\n      'Реализации потенциала в ключевых для компании направлениях',\n    ].map((text, i) => ({ n: '0' + (i + 1), text }));\n\n    const taskPalette = [\n      { bg: '#0B2447', fg: '#fff', muted: '#9FB4D0', numColor: '#F26B21' },\n      { bg: '#F4F7FB', fg: '#0B2447', muted: '#3D5473', numColor: '#0B5FB0' },\n      { bg: '#F26B21', fg: '#fff', muted: '#FFE0CC', numColor: '#0B2447' },\n      { bg: '#EAF3FC', fg: '#0B2447', muted: '#3D5473', numColor: '#0B5FB0' },\n    ];\n    const tasks = [\n      { title: 'Развитие экспертизы', text: 'Усиливаем профессиональные и STEM-компетенции, формируя устойчивую базу знаний и навыков для роста.' },\n      { title: 'Расширение возможностей', text: 'Открываем больше точек входа для участия женщин в ключевых бизнес-направлениях компании.' },\n      { title: 'Кадровый резерв', text: 'Готовим новое поколение специалистов для технических и управленческих ролей.' },\n      { title: 'Культура равных возможностей', text: 'Формируем среду, где ценятся профессионализм, равенство и вклад каждого.' },\n    ].map((t, i) => ({ ...t, num: '0' + (i + 1), ...taskPalette[i] }));\n\n    const directions = [\n      { title: 'Обучающие мероприятия', text: 'Тренинги, семинары и мастер-классы, направленные на развитие профессиональных знаний, практических навыков и лидерских компетенций.' },\n      { title: 'Развитие лидерских навыков', text: 'Программы и мероприятия, направленные на развитие управленческих компетенций, лидерского потенциала и готовности к новым карьерным возможностям.' },\n      { title: 'Нетворкинг и сотрудничество', text: 'Укрепление профессиональных связей, обмен практическим опытом и развитие культуры взаимодействия.' },\n      { title: 'Корпоративные и отраслевые инициативы', text: 'Участие в проектах, мероприятиях и сообществах компании и отрасли, способствующих профессиональному росту и развитию сотрудничества.' },\n    ].map((d, i) => ({ ...d, num: '0' + (i + 1) }));\n\n    const helps = [\n      'Развивать профессиональные и лидерские навыки',\n      'Находить единомышленников и расширять круг контактов',\n      'Реализовывать себя в ключевых направлениях компании',\n    ];\n\n    const sheTalks = [\n      'Реальные истории сотрудниц',\n      'Профессиональный путь и опыт',\n      'Честные разговоры о развитии и лидерстве',\n    ].map((text, i) => ({ n: '0' + (i + 1), text }));\n\n    const videoIds = ['9eHVtM4VMHM', '1KEMypmlJYk', 'JCPgeFpKZUs', 'RrOV2wtTWF8'];\n    const stTitles = [\n      'She Talks. Назига Кенжалиева — заведующая лабораторией Атырауского филиала КМГ Инжиниринг',\n      'Әкелер күні қарсаңында түсірілген \"Әке аманаты\" атты арнайы подкаст',\n      'She Talks. Марина Похилюк — эксперт',\n      'She Talks. Надежда Дукесова — эксперт',\n    ];\n    const stTopics = [\n      'О пути в науку и работе лаборатории Атырауского филиала',\n      'Семейные истории и роль отца в жизни сотрудников компании',\n      'Экспертный опыт и профессиональный рост в инжиниринге',\n      'Личный путь в профессии и советы молодым специалисткам',\n    ];\n    const stVideos = videoIds.map((id, i) => ({\n      id,\n      title: stTitles[i],\n      topic: stTopics[i],\n      tag: 'Выпуск ' + (i + 1),\n      thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg',\n      url: 'https://youtu.be/' + id,\n      embed: 'https://www.youtube.com/embed/' + id + '?autoplay=1',\n      playing: this.state.stPlaying === id,\n      notPlaying: this.state.stPlaying !== id,\n      play: () => this.setState({ stPlaying: id }),\n    }));\n    const stDots = videoIds.map((id, i) => ({\n      go: () => this.goSt(i),\n      w: i === this.state.stSlide ? 26 : 8,\n      bg: i === this.state.stSlide ? '#F26B21' : 'rgba(11,36,71,0.2)',\n    }));\n\n    const stats = [\n      { n: '115', label: 'участниц' },\n      { n: '20', label: 'мастер-классов для женщин' },\n      { n: '12', label: 'тренингов' },\n      { n: '10', label: 'женщин-наставниц' },\n      { n: '4', label: 'онлайн-конференции' },\n    ];\n\n    return {\n      heroChips, conditions, tasks, directions, helps, sheTalks, stats,\n      docs: [\n        { title: 'Положение о программе Women\\'s Space', hint: 'Утверждённая программа · PDF', href: '#' },\n        { title: 'Дорожная карта программы', hint: 'План мероприятий · PDF', href: '#' },\n        { title: 'Согласие на вступление в программу', hint: 'Форма согласия · PDF', href: '#' },\n        { title: 'Иные регламентирующие документы', hint: 'Приложения · PDF', href: '#' },\n      ],\n      nextSteps: [\n        { n: '1', text: 'Куратор рассматривает заявку в течение 3 рабочих дней' },\n        { n: '2', text: 'Короткий звонок или встреча-знакомство с куратором программы' },\n        { n: '3', text: 'Приглашение на ближайшее мероприятие и в чат сообщества' },\n      ],\n      agreeManager: this.state.agreeManager,\n      onAgreeChange: (e) => this.setState({ agreeManager: e.target.checked }),\n      stVideos, stDots,\n      stPct: this.state.stSlide * 100,\n      stPrev: () => this.goSt(this.state.stSlide - 1),\n      stNext: () => this.goSt(this.state.stSlide + 1),\n      formName: this.state.formName,\n      formDept: this.state.formDept,\n      formNote: this.state.formNote,\n      onNameChange: (e) => this.setState({ formName: e.target.value }),\n      onDeptChange: (e) => this.setState({ formDept: e.target.value }),\n      onNoteChange: (e) => this.setState({ formNote: e.target.value }),\n      submitForm: (e) => { e.preventDefault(); this.setState({ submitted: true }); },\n      resetForm: () => this.setState({ submitted: false, formName: '', formDept: '', formNote: '' }),\n      formSubmitted: this.state.submitted,\n      formNotSubmitted: !this.state.submitted,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
